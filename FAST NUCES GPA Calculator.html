<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FAST NUCES Grade Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --card: #fff;
            --row: #eef6fb;
            --tx: #192e59;
            --mut: #5a6a8a;
            --bd: #d3e5ef;
            --ac: #0099cb;
            --navy: #192e59;
            --ok: #1f9d55;
            --bad: #d64545;
            --warn: #b57a00;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html {
            scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #192e59 0, #101f42 100%);
            color: var(--tx);
            font: 16px/1.45 "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            z-index: 10;
            background: #fff
        }

        .nav {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 11;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 28px;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid var(--ac)
        }

        .brand {
            font: bold 15px Poppins, system-ui, sans-serif;
            color: var(--navy);
            letter-spacing: .02em
        }

        .brand span {
            color: var(--ac);
            font: 600 17px Poppins, system-ui, sans-serif;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: #e6eef7;
            padding: 4px;
            border-radius: 999px
        }

        .tab {
            background: transparent;
            color: var(--navy);
            border: 0;
            border-radius: 999px;
            padding: 9px 20px;
            font: 600 15px "Source Sans 3", system-ui, sans-serif;
            cursor: pointer
        }

        .tab.on {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 4px 12px rgba(25, 46, 89, .35)
        }

        .hero {
            text-align: center;
            padding: 48px 16px 44px;
            color: #fff;
            background: radial-gradient(640px 320px at 50% 0, rgba(0, 153, 203, .38), transparent 70%)
        }

        .logo {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: #fff;
            padding: 6px;
            margin: 0 auto 20px;
            box-shadow: 0 0 0 6px rgba(0, 153, 203, .4), 0 18px 44px rgba(0, 0, 0, .4)
        }

        .logo img {
            width: 100%;
            height: 100%;
            display: block
        }

        .eyebrow {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #8fdcf5;
            margin-bottom: 10px
        }

        .hero h1 {
            font: 700 44px/1.15 Poppins, system-ui, sans-serif;
            margin: 0 0 12px
        }

        .hero p {
            font-size: 19px;
            margin: 0;
            opacity: .9
        }

        .w {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 56px
        }

        .card {
            background: linear-gradient(135deg, #fff, #f4f8fc);
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, .25);
            color: var(--tx)
        }

        h2 {
            font: 600 20px Poppins, system-ui, sans-serif;
            margin: 0 0 14px;
            color: var(--navy)
        }

        button,
        select,
        input {
            font: inherit;
            color: var(--tx)
        }

        select,
        input {
            background: #fff;
            border: 1.5px solid var(--bd);
            border-radius: 999px;
            padding: 10px 16px;
            min-width: 0;
            width: 100%
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--ac);
            box-shadow: 0 0 0 3px rgba(0, 153, 203, .2)
        }

        .btn {
            background: #fff;
            border: 1.5px solid var(--bd);
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer
        }

        .btn.ac {
            color: var(--ac);
            border-color: var(--ac)
        }

        .btn.ac:hover {
            background: var(--ac);
            color: #fff
        }

        .btn.x {
            color: var(--bad);
            border-color: var(--bad);
            padding: 8px 12px
        }

        .dash {
            display: grid;
            gap: 22px;
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas: "setup" "side" "parts" "cuts"
        }

        .c-setup {
            grid-area: setup
        }

        .side {
            grid-area: side
        }

        .c-parts {
            grid-area: parts;
            display: grid;
            gap: 22px
        }

        .c-cuts {
            grid-area: cuts
        }

        @media(min-width:1000px) {
            .dash {
                grid-template-columns: minmax(0, 1fr) 390px;
                grid-template-areas: "setup side" "parts side" "cuts side";
                align-items: start
            }

            .side {
                position: sticky;
                top: calc(env(safe-area-inset-top, 0px) + 84px);
                max-height: calc(100vh - 110px);
                overflow: auto
            }
        }

        .gv {
            display: grid;
            gap: 22px;
            grid-template-columns: 1fr 1fr
        }

        .gfull {
            grid-column: 1/-1
        }

        .grp {
            margin: 18px 0 8px;
            padding-left: 10px;
            border-left: 3px solid var(--ac);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .grp b {
            font-size: 12px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--mut)
        }

        .it {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr auto;
            gap: 6px;
            align-items: center;
            background: var(--row);
            padding: 8px;
            border-radius: 18px;
            margin-bottom: 8px
        }

        .it span {
            color: var(--mut);
            text-align: center
        }

        .hd {
            font-size: 11px;
            color: var(--mut);
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr auto;
            gap: 6px;
            padding: 0 8px
        }

        .big {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .big3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .stat {
            background: var(--row);
            border-radius: 18px;
            padding: 14px
        }

        .stat small {
            color: var(--mut);
            display: block
        }

        .stat b {
            font: 700 21px Poppins, system-ui, sans-serif;
            color: var(--navy)
        }

        .stat.star {
            grid-column: 1/-1;
            order: -1;
            background: linear-gradient(135deg, #192e59, #0099cb)
        }

        .stat.star small {
            color: rgba(255, 255, 255, .82)
        }

        .stat.star b {
            color: #fff;
            font-size: 34px
        }

        .ok {
            color: var(--ok)
        }

        .bad {
            color: var(--bad)
        }

        .warn {
            color: var(--warn)
        }

        .mut {
            color: var(--mut);
            font-size: 14px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px
        }

        td,
        th {
            padding: 8px 6px;
            border-bottom: 1px solid var(--bd);
            text-align: left
        }

        td input {
            width: 90px;
            padding: 5px 12px
        }

        tr.hl {
            background: var(--row)
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .row>* {
            flex: 1;
            min-width: 140px
        }

        .sc {
            overflow-x: auto
        }

        .bar {
            display: flex;
            height: 10px;
            border-radius: 99px;
            overflow: hidden;
            background: #dde6ee;
            margin: 16px 0 6px
        }

        .bar i {
            background: var(--ac)
        }

        .bar u {
            background: #9fd8ea
        }

        #rst {
            margin-top: 12px
        }

        .ft {
            text-align: center;
            color: #fff;
            padding: 26px 16px calc(30px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(255, 255, 255, .18)
        }

        .ft p {
            margin: 0 0 2px;
            font: 600 16px Poppins, system-ui, sans-serif
        }

        .ft small {
            opacity: .8;
            font-size: 14px
        }

        @media(max-width:700px) {
            .gv {
                grid-template-columns: 1fr
            }

            .big3 {
                grid-template-columns: 1fr 1fr
            }
        }

        @media(max-width:560px) {
            .nav {
                padding: 10px 14px;
                justify-content: center
            }

            .tabs {
                width: 100%
            }

            .tab {
                flex: 1;
                padding: 9px 8px
            }

            .hero {
                padding: 32px 14px 30px
            }

            .logo {
                width: 104px;
                height: 104px
            }

            .hero h1 {
                font-size: 28px
            }

            .hero p {
                font-size: 16px
            }

            .w {
                padding: 0 12px 40px
            }

            .card {
                padding: 18px;
                border-radius: 18px
            }

            .it {
                grid-template-columns: 1fr 1fr auto
            }

            .hd {
                display: none
            }

            .it input:first-child {
                grid-column: 1/-1
            }
        }
    </style>
</head>

    </header>
    <div class="w">
        <div id="app"></div>
    </div>

    </footer>
    <script>
        var PRE = { T3: { n: 'Theory — 3(3,0)', t: 3, l: 0 }, TL4: { n: 'Theory + Lab — 4(3,1)', t: 3, l: 1 }, T2: { n: 'Theory — 2(2,0)', t: 2, l: 0 }, L1: { n: 'Lab only — 1(0,1)', t: 0, l: 1 } };
        var GR = [['A+', 4], ['A', 4], ['A-', 3.67], ['B+', 3.33], ['B', 3], ['B-', 2.67], ['C+', 2.33], ['C', 2], ['C-', 1.67], ['D+', 1.33], ['D', 1], ['F', 0]];
        var CUT = [90, 86, 82, 78, 74, 70, 66, 62, 58, 54, 50, 0];
        var GN = { qa: ['Quizzes + Assignments', 20], mid: ['Mid / Sessional', 30], fin: ['Final Exam', 50] };
        function it(n, w, t) { return { n: n, w: w, o: '', t: t } }
        function def() {
            return {
                preset: 'TL4', target: 'A', cut: CUT.slice(), cname: '', tab: 'c',
                theory: { qa: [it('', '', '')], mid: [it('', '', ''), it('', '', '')], fin: [it('', '', '')] },
                lab: { qa: [it('', '', '')], mid: [it('', '', ''), it('', '', '')], fin: [it('', '', '')] },
                sem: [], pc: '', pr: ''
            }
        }
        var S = def();
        try { var sv = localStorage.getItem('fastcalc4'); if (sv) { S = Object.assign(def(), JSON.parse(sv)) } } catch (e) { }
        function save() { try { localStorage.setItem('fastcalc4', JSON.stringify(S)) } catch (e) { } }
        function $(q) { return document.querySelector(q) }
        function n(v) { var x = parseFloat(v); return isNaN(x) ? 0 : x }
        function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;') }
        function parts() { var p = PRE[S.preset], tot = p.t + p.l, a = []; if (p.t) a.push(['theory', p.t / tot]); if (p.l) a.push(['lab', p.l / tot]); return a }
        function calc() {
            var E = 0, P = 0, D = 0, pend = []; parts().forEach(function (pp) {
                var s = pp[1];['qa', 'mid', 'fin'].forEach(function (g) {
                    S[pp[0]][g].forEach(function (x) {
                        if (x.o !== '') { E += s * n(x.o); D += s * n(x.w) } else { P += s * n(x.w); if (n(x.w) > 0) pend.push(x) }
                    })
                })
            }); return { E: E, P: P, D: D, pend: pend }
        }
        function gradeOf(p) { for (var i = 0; i < GR.length; i++)if (p >= S.cut[i] - 1e-9) return i; return GR.length - 1 }
        function f(x) { return (Math.round(x * 100) / 100).toString() }
        function render() {
            document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab) });
            $('#app').innerHTML = S.tab === 'c' ? viewC() : viewG(); update(); save()
        }
        function grpHtml(part, g) {
            var h = '<div class="grp"><b>' + GN[g][0] + ' · <span data-w="' + part + g + '"></span></b>' + (g === 'qa' ? '<button class="btn ac" data-add="' + part + '|' + g + '">+ Add</button>' : '') + '</div><div class="hd"><span>Name</span><span>Total weightage</span><span>Obtained weightage</span><span></span></div>';
            S[part][g].forEach(function (x, i) { var k = part + '|' + g + '|' + i; h += '<div class="it"><input placeholder="Type" list="types" data-f="n" data-k="' + k + '" value="' + esc(x.n) + '"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Total weightage" data-f="w" data-k="' + k + '" value="' + x.w + '"><input type="number" inputmode="decimal" step="any" min="0" placeholder="Obtained weightage" data-f="o" data-k="' + k + '" value="' + x.o + '">' + (g === 'qa' ? '<button class="btn x" data-del="' + k + '" title="Remove">✕</button>' : '') + '</div>' }); return h
        }
        function viewC() {
            var h = '<div class="dash"><div class="card c-setup"><h2>Course Setup</h2><div class="row"><input id="cn" placeholder="Course name (e.g. CS2001 Data Structures)" value="' + esc(S.cname) + '"><select id="pre">';
            for (var k in PRE) h += '<option value="' + k + '"' + (k === S.preset ? ' selected' : '') + '>' + PRE[k].n + '</option>'; h += '</select></div><datalist id="types"><option value="Quiz"><option value="Assignment"><option value="Project"><option value="Sessional I"><option value="Sessional II"><option value="Midterm"><option value="Final Exam"><option value="Lab Task"><option value="Lab Mid"><option value="Lab Final"></datalist><p class="mut">Weightage-based: Quiz + Assignment 20%, Mid 30%, Final 50% (as on the portal). For each item enter its total weightage and the weightage you obtained. Leave Obtained empty and the item counts as “pending”.</p><button class="btn x" id="rst">Reset all data</button></div>';
            h += '<div class="card side" id="res"></div><div class="c-parts">';
            parts().forEach(function (pp) { h += '<div class="card"><h2>' + (pp[0] === 'theory' ? 'Theory' : 'Lab') + ' <span class="mut">(share ' + f(pp[1] * 100) + '% of course)</span></h2>' + grpHtml(pp[0], 'qa') + grpHtml(pp[0], 'mid') + grpHtml(pp[0], 'fin') + '</div>' }); h += '</div><div class="card c-cuts" id="cuts"></div></div>';
            return h
        }
        function update() {
            if (S.tab !== 'c') { gUpdate(); return }
            parts().forEach(function (pp) {
                ['qa', 'mid', 'fin'].forEach(function (g) {
                    var s = 0, ge = 0, gd = 0; S[pp[0]][g].forEach(function (x, i) {
                        var w = n(x.w), has = x.o !== '', sc = has ? n(x.o) : 0, kk = pp[0] + '|' + g + '|' + i; s += w; if (has) { ge += sc; gd += w }
                        var oi = document.querySelector('input[data-f="o"][data-k="' + kk + '"]'); if (oi) oi.style.borderColor = (has && n(x.o) > w) ? 'var(--bad)' : ''
                    });
                    var el = document.querySelector('[data-w="' + pp[0] + g + '"]'); if (el) { var ok = Math.abs(s - GN[g][1]) < .01; el.innerHTML = '<span class="' + (ok ? 'ok' : 'warn') + '">weight ' + f(s) + ' / ' + GN[g][1] + '</span> · scored ' + f(ge) + ' / ' + f(gd) }
                })
            });
            var c = calc(), gi = gradeOf(c.E), ti = GR.findIndex(function (x) { return x[0] === S.target }), cut = S.cut[ti];
            var h = '<h2>Result</h2><div class="big"><div class="stat"><small>Earned so far</small><b>' + f(c.E) + ' / 100</b></div><div class="stat"><small>Score on entered work</small><b>' + (c.D > 0 ? f(c.E / c.D * 100) + '%' : '—') + '</b></div><div class="stat"><small>Pending weight</small><b>' + f(c.P) + '%</b></div><div class="stat star"><small>Current grade (if nothing more)</small><b>' + GR[gi][0] + ' (' + GR[gi][1].toFixed(2) + ')</b></div><div class="stat"><small>Projected at current pace</small><b>' + (c.D > 0 ? (function () { var p = c.E + c.P * c.E / c.D; return GR[gradeOf(p)][0] + ' (' + f(p) + ')' })() : '—') + '</b></div><div class="stat"><small>Max possible</small><b>' + f(c.E + c.P) + '</b></div></div><div class="bar"><i style="width:' + Math.min(100, c.E) + '%"></i><u style="width:' + Math.max(0, Math.min(100 - Math.min(100, c.E), c.P)) + '%"></u></div><p class="mut">Earned ' + f(c.E) + ' · Still available ' + f(c.P) + ' · Lost ' + f(Math.max(0, 100 - c.E - c.P)) + '</p>';
            h += '<div class="grp"><b>Target grade</b><select id="tg" style="width:auto">' + GR.slice(0, -1).map(function (x) { return '<option' + (x[0] === S.target ? ' selected' : '') + '>' + x[0] + '</option>' }).join('') + '</select></div>';
            if (c.D <= 0 && c.P <= 0) h += '<p class="mut">Enter the total weightage and obtained weightage of your items to see your grade and what you still need.</p>'; else if (c.P <= 0.0001) h += '<p>All marks are entered. Final: <b>' + GR[gi][0] + '</b>.</p>';
            else { var r = (cut - c.E) / c.P * 100; h += need(r, cut, c) }
            var topH = h; h = '<h2>Grade cutoffs</h2><div class="sc"><table><tr><th>Grade</th><th>GP</th><th>Min %</th><th>Needed in pending</th></tr>';
            GR.forEach(function (x, i) {
                var rr = c.P > 0 ? (S.cut[i] - c.E) / c.P * 100 : null, t = rr === null ? '—' : rr <= 0 ? '<span class="ok">Secured ✓</span>' : rr > 100 ? '<span class="bad">Not possible</span>' : f(rr) + '%';
                h += '<tr class="' + (x[0] === S.target ? 'hl' : '') + '"><td>' + x[0] + '</td><td>' + x[1].toFixed(2) + '</td><td><input type="number" step="any" data-cut="' + i + '" value="' + S.cut[i] + '"></td><td>' + t + '</td></tr>'
            });
            h += '</table></div><p class="mut">Grade cutoffs at FAST vary with course/relative grading, so they are editable (the defaults are an estimate). Enter your instructor’s cutoffs.</p><button class="btn ac" id="addsem">+ Add this course to the SGPA list</button>';
            var r1 = $('#res'), r2 = $('#cuts'); if (r1) r1.innerHTML = topH; if (r2) { var ae = document.activeElement; if (ae && ae.dataset && ae.dataset.cut !== undefined) { var tr = r2.querySelectorAll('tr'); for (var i = 0; i < GR.length; i++)tr[i + 1].children[3].innerHTML = rowTxt(i, c); return } r2.innerHTML = h }
        }
        function rowTxt(i, c) { if (c.P <= 0) return '—'; var rr = (S.cut[i] - c.E) / c.P * 100; return rr <= 0 ? '<span class="ok">Secured ✓</span>' : rr > 100 ? '<span class="bad">Not possible</span>' : f(rr) + '%' }
        function need(r, cut, c) {
            if (r <= 0) return '<p class="ok"><b>' + S.target + ' already secured</b> ✓ (cutoff ' + cut + '%) — even if everything else is zero.</p>';
            if (r > 100) return '<p class="bad"><b>' + S.target + ' not possible</b> — needs the ' + cut + '% cutoff, but the max possible is only ' + f(c.E + c.P) + '%.</p>';
            var h = '<p>To get ' + S.target + ' (cutoff <b>' + cut + '%</b>), you need an average of <b class="' + (r > 85 ? 'warn' : 'ok') + '">' + f(r) + '%</b> across pending items:</p><ul>';
            c.pend.forEach(function (x) { h += '<li>' + (esc(x.n) || 'Item') + ': <b>' + f(r / 100 * n(x.w)) + ' / ' + x.w + '</b></li>' }); return h + '</ul>'
        }
        function viewG() {
            var h = '<div class="gv"><div class="card gfull"><h2>Semester GPA</h2><div class="sc"><table><tr><th>Course</th><th>Cr. Hrs</th><th>Grade</th><th></th></tr>';
            S.sem.forEach(function (x, i) { h += '<tr><td><input data-s="n|' + i + '" value="' + esc(x.n) + '" style="width:100%"></td><td><input type="number" data-s="cr|' + i + '" value="' + x.cr + '"></td><td><select data-s="g|' + i + '" style="width:80px">' + GR.map(function (g) { return '<option' + (g[0] === x.g ? ' selected' : '') + '>' + g[0] + '</option>' }).join('') + '</select></td><td><button class="btn x" data-sd="' + i + '">✕</button></td></tr>' });
            h += '</table></div><button class="btn ac" id="sadd" style="margin-top:8px">+ Add course</button></div><div class="card"><h2>CGPA (optional)</h2><div class="row"><input type="number" step="any" id="pc" placeholder="Previous CGPA" value="' + S.pc + '"><input type="number" step="any" id="pr" placeholder="Previous credit hours" value="' + S.pr + '"></div></div><div class="card"><div class="big big3"><div class="stat"><small>SGPA</small><b id="sg">–</b></div><div class="stat"><small>Credit hours</small><b id="sh">–</b></div><div class="stat"><small>CGPA</small><b id="cg">–</b></div></div></div></div>'; return h
        }
        function gUpdate() {
            var q = 0, c = 0; S.sem.forEach(function (x) { var g = GR.find(function (y) { return y[0] === x.g }); q += n(x.cr) * g[1]; c += n(x.cr) });
            if (!$('#sg')) return; $('#sg').textContent = c ? (q / c).toFixed(2) : '–'; $('#sh').textContent = c; var pc = n(S.pc), pr = n(S.pr); $('#cg').textContent = (c + pr) ? ((q + pc * pr) / (c + pr)).toFixed(2) : '–'
        }
        document.addEventListener('click', function (e) {
            var t = e.target, d = t.dataset;
            if (d.tab) { S.tab = d.tab; render(); return }
            if (d.add) { var a = d.add.split('|'); S[a[0]][a[1]].push(it('', '', '')); render() }
            else if (d.del) { var k = d.del.split('|'); S[k[0]][k[1]].splice(+k[2], 1); render() }
            else if (t.id === 'addsem') { var c = calc(), p = PRE[S.preset]; S.sem.push({ n: S.cname || 'Course', cr: p.t + p.l, g: c.P > 0 ? S.target : GR[gradeOf(c.E)][0] }); S.tab = 'g'; render() }
            else if (t.id === 'sadd') { S.sem.push({ n: 'Course', cr: 3, g: 'A' }); render() }
            else if (d.sd) { S.sem.splice(+d.sd, 1); render() }
            else if (t.id === 'rst') { if (d.arm) { S = def(); render() } else { d.arm = 1; t.textContent = 'Click again to confirm reset'; setTimeout(function () { if (t.isConnected) { delete t.dataset.arm; t.textContent = 'Reset all data' } }, 3000) } }
        });
        document.addEventListener('input', function (e) {
            var t = e.target, d = t.dataset;
            if (d.f) { var k = d.k.split('|'); S[k[0]][k[1]][+k[2]][d.f] = (d.f === 'n' || d.f === 'o') ? t.value : t.value }
            else if (d.cut !== undefined) S.cut[+d.cut] = n(t.value);
            else if (d.s) { var s = d.s.split('|'); S.sem[+s[1]][s[0]] = t.value }
            else if (t.id === 'cn') S.cname = t.value; else if (t.id === 'pc') S.pc = t.value; else if (t.id === 'pr') S.pr = t.value; else return;
            save(); update()
        });
        document.addEventListener('change', function (e) {
            var t = e.target;
            if (t.id === 'pre') { S.preset = t.value; render() } else if (t.id === 'tg') { S.target = t.value; save(); var c = $('#res'); update() }
            else if (t.dataset.s) { update(); save() }
        });
        render();
    </script>
</body>
